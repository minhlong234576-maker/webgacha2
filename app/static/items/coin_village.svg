<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="vgGold" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="vgRing" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer Coin Rim -->
  <circle cx="50" cy="50" r="48" fill="url(#vgRing)" stroke="#065f46" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Inner Coin Base -->
  <circle cx="50" cy="50" r="40" fill="url(#vgGold)"/>
  <!-- Village Emerald Emblem / Roof -->
  <polygon points="50,18 72,36 28,36" fill="#f6d860" stroke="#b45309" stroke-width="1.5"/>
  <polygon points="50,22 68,36 32,36" fill="#fde68a"/>
  <!-- House base -->
  <rect x="33" y="36" width="34" height="28" rx="2" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="44" y="44" width="12" height="20" rx="3" fill="#451a03"/>
  <!-- Emerald Icon in center -->
  <polygon points="50,46 56,52 50,60 44,52" fill="#a7f3d0" stroke="#059669" stroke-width="1"/>
  <!-- Wheat / Laurel accents -->
  <path d="M22 62 C 22 75, 35 82, 50 82 C 65 82, 78 75, 78 62" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="82" r="3.5" fill="#fef08a"/>
</svg>
