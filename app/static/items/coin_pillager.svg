<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="plgRed" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="plgRing" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="plgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Coin Rim -->
  <circle cx="50" cy="50" r="48" fill="url(#plgRing)" stroke="#450a0a" stroke-width="2" filter="url(#plgShadow)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Inner Coin Base -->
  <circle cx="50" cy="50" r="40" fill="url(#plgRed)"/>
  <!-- Pillager Face / Illager Eyebrows & Nose Emblem -->
  <!-- Forehead / Horns banner -->
  <rect x="36" y="24" width="28" height="34" rx="4" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <!-- Angry Brows -->
  <polygon points="34,31 50,37 50,34 34,28" fill="#1e293b"/>
  <polygon points="66,31 50,37 50,34 66,28" fill="#1e293b"/>
  <!-- Illager Eyes (Blue/Teal) -->
  <rect x="38" y="37" width="5" height="5" fill="#38bdf8"/>
  <rect x="57" y="37" width="5" height="5" fill="#38bdf8"/>
  <!-- Long Big Nose -->
  <rect x="46" y="38" width="8" height="18" rx="3" fill="#475569" stroke="#1e293b" stroke-width="1"/>
  <!-- Crossbow Crossed / Spikes bottom -->
  <path d="M26 74 L74 74" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 68 L50 78 L70 68" fill="none" stroke="#fecaca" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="80" r="3" fill="#f87171"/>
</svg>
